<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="Watch L.E.A. Trio videos and sessions." />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('images/LEA_logo_circle.png') no-repeat center center;
      background-size: 42vmin;
      opacity: 0.08;
      z-index: 0;

    body > * { position: relative; z-index: 1; }

<body>
  <header class="header">
    <div class="container nav">

              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

            </iframe>
          </div>
          <div class="card-body">
            <strong>Latest release:</strong> Live in Arthur’s Jazz Club •
            <a href="https://www.youtube.com/watch?v=flmJ1_7CMQ0" target="_blank" rel="noopener">

            </a>

        </div>

        <!-- Second video -->
        <div class="card">
          <div class="embed">

              Open on YouTube
            </a>

        </div>

      </div>

  <footer class="footer">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
      <div>© <span id="year"></span> L.E.A. Trio</div>
      <div><a href="contact.html">Booking</a></div>
